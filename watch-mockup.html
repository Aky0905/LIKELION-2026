<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ORBIT Watch Mockup</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #4a9eff;
    --primary-light: #e8f4ff;
    --ink: #1a1a2e;
    --sub: #6b7280;
    --danger: #ef5b5b;
  }

  body {
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: #f4f8fd;
    color: var(--ink);
    padding: 56px 48px;
    width: 1024px;
  }

  .badge {
    color: var(--primary);
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.04em;
    margin-bottom: 12px;
  }

  h1.headline {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 56px;
  }

  .watch-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .watch-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .watch {
    position: relative;
    width: 150px;
    height: 182px;
    margin-bottom: 26px;
  }

  .band {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 96px;
    background: #2a2d34;
    z-index: 1;
  }
  .band.top { top: -30px; height: 60px; border-radius: 18px 18px 10px 10px; }
  .band.bottom { bottom: -30px; height: 60px; border-radius: 10px 10px 18px 18px; }

  .case {
    position: absolute;
    inset: 0;
    background: linear-gradient(150deg, #3a3d44, #202227);
    border-radius: 44px;
    z-index: 2;
    box-shadow: 0 12px 30px rgba(0,0,0,0.22);
    padding: 12px;
  }

  .crown {
    position: absolute;
    right: -5px;
    top: 58px;
    width: 6px;
    height: 26px;
    background: #4a4d54;
    border-radius: 3px;
    z-index: 3;
  }
  .sidebtn {
    position: absolute;
    right: -4px;
    top: 96px;
    width: 5px;
    height: 34px;
    background: #3a3d44;
    border-radius: 3px;
    z-index: 3;
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    border-radius: 34px;
    overflow: hidden;
    z-index: 3;
    display: flex;
    flex-direction: column;
  }

  .screen-inner {
    flex: 1;
    background: radial-gradient(circle at 50% 0%, #12151b, #000);
    padding: 12px 12px 10px;
    display: flex;
    flex-direction: column;
    color: #fff;
  }

  .time {
    font-size: 12px;
    font-weight: 700;
    color: #cfe3ff;
    text-align: right;
    margin-bottom: 6px;
  }

  .cap-title {
    font-size: 15px;
    font-weight: 800;
    color: var(--primary);
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }
  .cap-sub {
    font-size: 13px;
    color: var(--sub);
    font-weight: 500;
  }

  .scr-label { font-size: 10px; color: #8fa3bd; font-weight: 600; margin-bottom: 4px; }
  .scr-big { font-size: 15px; font-weight: 800; line-height: 1.25; }
  .pill {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 8px;
    background: rgba(255,255,255,0.14);
    color: #ffd27a;
    margin-top: 6px;
  }

  .skin-ring {
    width: 54px; height: 54px; border-radius: 50%;
    margin: 6px auto 8px;
    background: conic-gradient(var(--danger) 0 72%, rgba(255,255,255,0.15) 72% 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .skin-ring > div {
    width: 42px; height: 42px; border-radius: 50%;
    background: #0c0f14; display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800; color: #ff8f8f;
  }

  .data-row {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .data-row:last-child { border-bottom: none; }
  .data-ico {
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(74,158,255,0.22);
    display: flex; align-items: center; justify-content: center;
    color: #7cc0ff; flex-shrink: 0;
  }
  .data-name { font-size: 10px; color: #b8c4d4; flex: 1; }
  .data-val { font-size: 11px; font-weight: 700; color: #fff; }

  .care-ico {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(74,158,255,0.18);
    display: flex; align-items: center; justify-content: center;
    margin: 8px auto 10px; color: #7cc0ff;
  }

  .trend-box {
    flex: 1; display: flex; align-items: center; justify-content: center;
  }

  .book-ico {
    width: 42px; height: 42px; border-radius: 12px;
    background: rgba(74,158,255,0.18);
    display: flex; align-items: center; justify-content: center;
    margin: 6px auto 10px; color: #7cc0ff;
  }
  .book-date { font-size: 16px; font-weight: 800; text-align: center; }
  .book-time { font-size: 11px; color: #9fb4cc; text-align: center; margin-top: 2px; }

  .center-col { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; }
</style>
</head>
<body>

  <div class="badge">WATCH</div>
  <h1 class="headline">피부 관리가 일상 속으로 들어옵니다.</h1>

  <div class="watch-row">

    <!-- 1. TODAY SKIN -->
    <div class="watch-cell">
      <div class="watch">
        <div class="band top"></div>
        <div class="band bottom"></div>
        <div class="crown"></div>
        <div class="sidebtn"></div>
        <div class="case">
          <div class="screen">
            <div class="screen-inner">
              <div class="time">9:41</div>
              <div class="scr-label">오늘의 피부</div>
              <div class="skin-ring"><div>72</div></div>
              <div class="scr-big">건조 · 민감<br/>가능성 높음</div>
              <span class="pill">주의</span>
            </div>
          </div>
        </div>
      </div>
      <div class="cap-title">TODAY SKIN</div>
      <div class="cap-sub">오늘의 피부 예측</div>
    </div>

    <!-- 2. DAILY DATA -->
    <div class="watch-cell">
      <div class="watch">
        <div class="band top"></div>
        <div class="band bottom"></div>
        <div class="crown"></div>
        <div class="sidebtn"></div>
        <div class="case">
          <div class="screen">
            <div class="screen-inner">
              <div class="time">9:41</div>
              <div class="scr-label">오늘의 데이터</div>
              <div style="margin-top:4px;">
                <div class="data-row">
                  <div class="data-ico">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                  </div>
                  <span class="data-name">수면</span>
                  <span class="data-val">5h 40m</span>
                </div>
                <div class="data-row">
                  <div class="data-ico">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                  </div>
                  <span class="data-name">HRV</span>
                  <span class="data-val">-16%</span>
                </div>
                <div class="data-row">
                  <div class="data-ico">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="1"/><path d="M4 17l5 1l.75 -1.5"/><path d="M15 21l0 -4l-4 -3l1 -6"/><path d="M7 12l0 -3l5 -1l3 3l3 1"/></svg>
                  </div>
                  <span class="data-name">활동량</span>
                  <span class="data-val">+45%</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="cap-title">DAILY DATA</div>
      <div class="cap-sub">수면, HRV, 활동량</div>
    </div>

    <!-- 3. TODAY CARE -->
    <div class="watch-cell">
      <div class="watch">
        <div class="band top"></div>
        <div class="band bottom"></div>
        <div class="crown"></div>
        <div class="sidebtn"></div>
        <div class="case">
          <div class="screen">
            <div class="screen-inner">
              <div class="time">9:41</div>
              <div class="center-col">
                <div class="scr-label" style="text-align:center;">오늘의 케어</div>
                <div class="care-ico">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                </div>
                <div class="scr-big" style="text-align:center;">진정 · 보습<br/>케어</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="cap-title">TODAY CARE</div>
      <div class="cap-sub">오늘의 케어</div>
    </div>

    <!-- 4. TREND -->
    <div class="watch-cell">
      <div class="watch">
        <div class="band top"></div>
        <div class="band bottom"></div>
        <div class="crown"></div>
        <div class="sidebtn"></div>
        <div class="case">
          <div class="screen">
            <div class="screen-inner">
              <div class="time">9:41</div>
              <div class="scr-label">피부 변화</div>
              <div class="trend-box">
                <svg width="118" height="80" viewBox="0 0 118 80" fill="none">
                  <polyline points="6,58 26,54 46,46 62,30 78,40 98,26 112,30" fill="none" stroke="#69B5FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="62" cy="30" r="3.2" fill="#fff" stroke="#FF7474" stroke-width="2"/>
                  <circle cx="6" cy="58" r="2.4" fill="#69B5FF"/>
                  <circle cx="46" cy="46" r="2.4" fill="#69B5FF"/>
                  <circle cx="98" cy="26" r="2.4" fill="#69B5FF"/>
                  <line x1="6" y1="70" x2="112" y2="70" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                </svg>
              </div>
              <div style="font-size:10px;color:#9fb4cc;text-align:center;">최근 4주 · 개선 추세</div>
            </div>
          </div>
        </div>
      </div>
      <div class="cap-title">피부 변화 트렌드</div>
      <div class="cap-sub">변화 추이 확인</div>
    </div>

    <!-- 5. WHS 예약 -->
    <div class="watch-cell">
      <div class="watch">
        <div class="band top"></div>
        <div class="band bottom"></div>
        <div class="crown"></div>
        <div class="sidebtn"></div>
        <div class="case">
          <div class="screen">
            <div class="screen-inner">
              <div class="time">9:41</div>
              <div class="center-col">
                <div class="scr-label" style="text-align:center;">다음 예약</div>
                <div class="book-ico">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                </div>
                <div class="book-date">8월 22일</div>
                <div class="book-time">오후 2:00 · WHS 정밀 진단</div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="cap-title">WHS 예약</div>
      <div class="cap-sub">예약 일정 확인</div>
    </div>

  </div>

</body>
</html>
